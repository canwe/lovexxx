<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>&lt;3</title>
  <meta name="description" content="&lt;3">
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="preloader" id="preloader" aria-hidden="true">
    <div class="preloader-wrap">
      <div class="preloader-mark">&lt;3</div>
    </div>
  </div>

  <div class="home-wrap" id="home">
    <div class="portals portals-type" id="portal-labels"></div>
    <div class="portals portals-images" id="portal-images" aria-hidden="true"></div>
  </div>

  <!-- Enter stage — contact: continuous 100ms flash; press freezes current frame -->
  <div class="portal-stage" id="portal-stage" hidden>
    <div class="portal-stage-images contact-images-center" id="stage-images"></div>
    <div class="portal-stage-text" id="stage-text">
      <div class="portal-stage-text-wrap">
        <img class="portal-stage-title" id="stage-title" alt="" draggable="false">
      </div>
    </div>
  </div>

  <a href="./" class="back hider" id="back" aria-label="Back to grid">&larr;</a>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
